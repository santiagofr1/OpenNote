name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Set version
        run: |
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${{ github.run_number }} + 200 ))" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64. No se publica una release firmada con la clave de debug."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      # Sincronización con Google Drive: los IDs de cliente salen de secretos del repositorio. Si no existen, la app
      # compila igual y la pantalla de sincronización avisa que falta configurar (ver docs/SINCRONIZACION.md).
      - name: Datos de Google (opcional)
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_SECRET }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            jq -n --arg web "$GOOGLE_WEB_CLIENT_ID" --arg wsec "$GOOGLE_WEB_CLIENT_SECRET" --arg did "$GOOGLE_DESKTOP_CLIENT_ID" --arg dsec "$GOOGLE_DESKTOP_CLIENT_SECRET" \
              '{GOOGLE_WEB_CLIENT_ID: $web, GOOGLE_WEB_CLIENT_SECRET: $wsec, GOOGLE_DESKTOP_CLIENT_ID: $did, GOOGLE_DESKTOP_CLIENT_SECRET: $dsec}' > google_config.json
            echo "DART_DEFINES=--dart-define-from-file=google_config.json" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto GOOGLE_WEB_CLIENT_ID: esta release sale sin sincronización con Google."
          fi

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            $DART_DEFINES
          rm -f google_config.json
          mv build/app/outputs/flutter-apk/app-release.apk "OpenNote-v${VERSION_NAME}.apk"

      - name: Prepare release notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --first-parent --pretty=format:'- %s' "${PREVIOUS_TAG}..HEAD")
          else
            COMMITS=$(git log -n 30 --pretty=format:'- %s' HEAD)
          fi
          if [ -z "$COMMITS" ]; then
            COMMITS="- Sin cambios desde la versión anterior."
          fi
          {
            echo "RELEASE_BODY<<EOF"
            echo "$COMMITS"
            echo ""
            echo "**APK:** OpenNote-v${VERSION_NAME}.apk"
            echo "**Código de versión:** ${VERSION_CODE}"
            echo ""
            echo "**Windows:** OpenNote-v${VERSION_NAME}-windows-setup.exe (lo sube el job windows unos minutos después)."
            echo ""
            echo "**Linux (Debian/Ubuntu):** opennote_${VERSION_NAME}_amd64.deb (lo sube el job linux unos minutos después)."
            echo ""
            echo "Desde el repo apt:"
            echo '```sh'
            echo 'sudo install -d -m 0755 /etc/apt/keyrings'
            echo 'curl -fsSL https://santiagofr1.github.io/apt/key.asc | sudo gpg --dearmor -o /etc/apt/keyrings/santiagofr1.gpg'
            echo 'echo "deb [signed-by=/etc/apt/keyrings/santiagofr1.gpg] https://santiagofr1.github.io/apt stable main" | sudo tee /etc/apt/sources.list.d/santiagofr1.list'
            echo 'sudo apt update'
            echo 'sudo apt install opennote'
            echo '```'
            echo "O con el .deb suelto:"
            echo '```sh'
            echo "sudo apt install ./opennote_${VERSION_NAME}_amd64.deb"
            echo '```'
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: OpenNote v${{ env.VERSION_NAME }}
          body: ${{ env.RELEASE_BODY }}
          files: OpenNote-v${{ env.VERSION_NAME }}.apk
          make_latest: true

      - name: Podar releases viejos
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: 2
          CURRENT_TAG: v${{ env.VERSION_NAME }}
        run: |
          gh release list --json tagName,createdAt,isLatest,isDraft,isPrerelease --limit 200 \
            | tool/podar_releases.sh

  # App de Linux: corre cuando la release ya está publicada y le suma el .deb como asset. Si falla, el APK
  # y el aviso de actualización de Android no se ven afectados.
  linux:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev python3-pil

      - name: Install dependencies
        run: flutter pub get

      - name: Set version
        run: echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Datos de Google (opcional)
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_SECRET }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            jq -n --arg web "$GOOGLE_WEB_CLIENT_ID" --arg wsec "$GOOGLE_WEB_CLIENT_SECRET" --arg did "$GOOGLE_DESKTOP_CLIENT_ID" --arg dsec "$GOOGLE_DESKTOP_CLIENT_SECRET" \
              '{GOOGLE_WEB_CLIENT_ID: $web, GOOGLE_WEB_CLIENT_SECRET: $wsec, GOOGLE_DESKTOP_CLIENT_ID: $did, GOOGLE_DESKTOP_CLIENT_SECRET: $dsec}' > google_config.json
          else
            echo "::warning::Falta el secreto GOOGLE_WEB_CLIENT_ID: el .deb sale sin sincronización con Google."
          fi

      - name: Armar .deb
        run: |
          tool/build_deb.sh "$VERSION_NAME"
          rm -f google_config.json

      - name: Subir el .deb a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${VERSION_NAME}" "dist/opennote_${VERSION_NAME}_amd64.deb" --clobber

      # Sin el secreto no pasa nada: el repo apt lo levanta igual con su cron horario.
      - name: Avisar al repo apt (santiagofr1/apt)
        env:
          TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "sin APT_DISPATCH_TOKEN, lo levanta el cron"; exit 0; }
          GH_TOKEN="$TOKEN" gh api repos/santiagofr1/apt/dispatches -f event_type=publish

  # App de Windows: corre cuando la release ya está publicada y le suma el instalador .exe como asset. Si falla,
  # el APK, el .deb y el aviso de actualización de Android no se ven afectados.
  windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set version
        run: |
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${{ github.run_number }} + 200 ))" >> "$GITHUB_ENV"

      - name: Datos de Google (opcional)
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_SECRET }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            jq -n --arg web "$GOOGLE_WEB_CLIENT_ID" --arg wsec "$GOOGLE_WEB_CLIENT_SECRET" --arg did "$GOOGLE_DESKTOP_CLIENT_ID" --arg dsec "$GOOGLE_DESKTOP_CLIENT_SECRET" \
              '{GOOGLE_WEB_CLIENT_ID: $web, GOOGLE_WEB_CLIENT_SECRET: $wsec, GOOGLE_DESKTOP_CLIENT_ID: $did, GOOGLE_DESKTOP_CLIENT_SECRET: $dsec}' > google_config.json
            echo "DART_DEFINES=--dart-define-from-file=google_config.json" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto GOOGLE_WEB_CLIENT_ID: el instalador de Windows sale sin sincronización con Google."
          fi

      - name: Compilar app de Windows
        run: |
          flutter build windows --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            $DART_DEFINES
          rm -f google_config.json

      - name: Armar instalador (Inno Setup)
        run: |
          if ! command -v iscc >/dev/null 2>&1; then
            choco install innosetup -y --no-progress
            export PATH="$PATH:/c/Program Files (x86)/Inno Setup 6"
          fi
          iscc "//DAppVersion=${VERSION_NAME}" windows/installer/opennote.iss

      - name: Subir el instalador a la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          files: dist/OpenNote-v${{ env.VERSION_NAME }}-windows-setup.exe
