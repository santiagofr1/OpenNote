name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Set version
        run: |
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64. No se publica una release firmada con la clave de debug."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE"
          mv build/app/outputs/flutter-apk/app-release.apk "OpenNote-v${VERSION_NAME}.apk"

      - name: Prepare release notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --first-parent --pretty=format:'- %s' "${PREVIOUS_TAG}..HEAD")
          else
            COMMITS=$(git log -n 30 --pretty=format:'- %s' HEAD)
          fi
          if [ -z "$COMMITS" ]; then
            COMMITS="- Sin cambios desde la versión anterior."
          fi
          {
            echo "RELEASE_BODY<<EOF"
            echo "$COMMITS"
            echo ""
            echo "**APK:** OpenNote-v${VERSION_NAME}.apk"
            echo "**Código de versión:** ${VERSION_CODE}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: OpenNote v${{ env.VERSION_NAME }}
          body: ${{ env.RELEASE_BODY }}
          files: OpenNote-v${{ env.VERSION_NAME }}.apk
          make_latest: true
