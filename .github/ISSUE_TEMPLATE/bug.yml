name: Bug report
description: Something doesn't work the way it should in Vynote
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: What happened?
      description: Tell us in your own words. If you know how to reproduce it, even better.
      placeholder: When I close a notebook with text, the last line disappears.
    validations:
      required: true

  - type: input
    id: dispositivo
    attributes:
      label: Device and app version
      placeholder: Galaxy Tab S6 Lite, Android 16, Vynote 1.0.0
    validations:
      required: false

  - type: textarea
    id: capturas
    attributes:
      label: Screenshots or video
      description: Optional. Drag images or a video here.
    validations:
      required: false
