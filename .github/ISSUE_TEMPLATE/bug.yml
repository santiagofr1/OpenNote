name: Reporte de error
description: Algo no funciona como debería en OpenNote
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: ¿Qué pasó?
      description: Contalo con tus palabras. Si sabés cómo repetirlo, mejor.
      placeholder: Al cerrar un cuaderno con texto, la última línea desaparece.
    validations:
      required: true

  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y versión de la app
      placeholder: Galaxy Tab S6 Lite, Android 16, OpenNote 1.0.0
    validations:
      required: false

  - type: textarea
    id: capturas
    attributes:
      label: Capturas o video
      description: Opcional. Arrastrá imágenes o un video acá.
    validations:
      required: false
